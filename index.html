<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — ระบบสามเกลอ อำเภอพิมาย</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
  * { font-family: 'Sarabun', sans-serif; }
  body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); min-height: 100vh; }
  .card { backdrop-filter: blur(16px); background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); }
  .btn-primary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); transition: all 0.2s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(59,130,246,0.4); }
  .input-field { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; transition: all 0.2s; }
  .input-field:focus { outline: none; border-color: #3b82f6; background: rgba(59,130,246,0.1); }
  .input-field::placeholder { color: rgba(255,255,255,0.4); }
  .logo-ring { animation: pulse-ring 3s ease-in-out infinite; }
  @keyframes pulse-ring { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
  .error-box { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); }
  .loading { display: none; }
  .loading.active { display: flex; }
</style>
</head>
<body class="flex items-center justify-center p-4">

<div class="w-full max-w-sm">

  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="logo-ring inline-flex items-center justify-center w-20 h-20 rounded-full bg-blue-500/20 border-2 border-blue-400/40 mb-4">
      <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-white mb-1">ระบบสามเกลอ</h1>
    <p class="text-blue-300/70 text-sm">อำเภอพิมาย จังหวัดนครราชสีมา</p>
  </div>

  <!-- Card -->
  <div class="card rounded-2xl p-8">
    <h2 class="text-white font-semibold text-lg mb-6 text-center">เข้าสู่ระบบ</h2>

    <!-- Error -->
    <div id="errorBox" class="error-box hidden rounded-xl p-3 mb-5 text-red-300 text-sm text-center"></div>

    <!-- Form -->
    <div class="space-y-4">
      <div>
        <label class="text-blue-200/70 text-sm mb-2 block">ชื่อผู้ใช้งาน</label>
        <input id="username" type="text" placeholder="กรอกชื่อผู้ใช้งาน"
          class="input-field w-full rounded-xl px-4 py-3 text-sm"
          autocomplete="username">
      </div>
      <div>
        <label class="text-blue-200/70 text-sm mb-2 block">รหัสผ่าน</label>
        <input id="password" type="password" placeholder="กรอกรหัสผ่าน"
          class="input-field w-full rounded-xl px-4 py-3 text-sm"
          autocomplete="current-password">
      </div>
    </div>

    <!-- Button -->
    <button id="loginBtn" onclick="doLogin()"
      class="btn-primary w-full mt-6 py-3 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
      <span id="btnText">เข้าสู่ระบบ</span>
      <div class="loading active" id="btnSpinner">
        <svg class="animate-spin w-4 h-4 hidden" id="spinnerIcon" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
        </svg>
      </div>
    </button>
  </div>

  <p class="text-center text-white/30 text-xs mt-6">v2.0.0 · ระบบเฝ้าระวังผู้ป่วยจิตเวช</p>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  // ถ้า Login อยู่แล้ว ไป Dashboard เลย
  if (Auth.getSession()) {
    const role = Auth.getSession().role;
    const home = APP_CONFIG.ROLES[role]?.home || "dashboard.html";
    window.location.href = "pages/" + home;
  }

  // กด Enter ได้
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("username").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("password").focus();
  });

  async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    const errBox = document.getElementById("errorBox");
    const spinner = document.getElementById("spinnerIcon");
    const btnText = document.getElementById("btnText");

    if (!username || !password) {
      showError("กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน");
      return;
    }

    // Loading state
    btn.disabled = true;
    spinner.classList.remove("hidden");
    btnText.textContent = "กำลังเข้าสู่ระบบ...";
    errBox.classList.add("hidden");

    const res = await API.login(username, password);

    btn.disabled = false;
    spinner.classList.add("hidden");
    btnText.textContent = "เข้าสู่ระบบ";

    if (res.success) {
      Auth.setSession(res.data.user, res.data.token);
      const role = res.data.user.role;
      const home = APP_CONFIG.ROLES[role]?.home || "dashboard.html";
      window.location.href = "pages/" + home;
    } else {
      showError(res.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
    }
  }

  function showError(msg) {
    const box = document.getElementById("errorBox");
    box.textContent = msg;
    box.classList.remove("hidden");
  }
</script>
</body>
</html>
