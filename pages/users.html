<script>
const session = Auth.requireAuth();
if (session) {
  document.getElementById("userName").textContent = session.full_name || session.username;
  document.getElementById("userRole").textContent = APP_CONFIG.ROLES[session.role]?.label || session.role;
}

const ROLE_COLORS = {
  SYSADMIN:"bg-purple-100 text-purple-700", DISTRICT:"bg-blue-100 text-blue-700",
  DOCTOR:"bg-green-100 text-green-700",     NURSE:"bg-teal-100 text-teal-700",
  ASOM:"bg-yellow-100 text-yellow-700",     VILLAGE_HEAD:"bg-orange-100 text-orange-700",
  FAMILY:"bg-pink-100 text-pink-700",       ADMIN_AMPHOE:"bg-indigo-100 text-indigo-700",
};
const ROLE_LABELS = {
  SYSADMIN:"System Admin", DISTRICT:"นายอำเภอ", DOCTOR:"แพทย์/พยาบาล",
  NURSE:"รพ.สต.", ASOM:"อสม.", VILLAGE_HEAD:"กำนัน/ผญบ.",
  FAMILY:"ครอบครัว", ADMIN_AMPHOE:"Admin อำเภอ"
};

let allUsers = [], editingId = null, resetTargetId = null;

async function loadUsers() {
  const res = await API.getUsers();
  if (!res.success) { showToast("โหลดข้อมูลไม่สำเร็จ","error"); return; }
  allUsers = res.data || [];
  renderStats(); filterUsers();
}

function renderStats() {
  const t = allUsers.length, a = allUsers.filter(u=>u.status==="ACTIVE").length;
  const r = [...new Set(allUsers.map(u=>u.role))].length, i = allUsers.filter(u=>u.status==="INACTIVE").length;
  document.getElementById("statsRow").innerHTML = `
    <div class="card p-3 text-center"><p class="text-2xl font-bold text-gray-800">${t}</p><p class="text-gray-400 text-xs mt-0.5">ทั้งหมด</p></div>
    <div class="card p-3 text-center"><p class="text-2xl font-bold text-green-600">${a}</p><p class="text-gray-400 text-xs mt-0.5">ใช้งานได้</p></div>
    <div class="card p-3 text-center"><p class="text-2xl font-bold text-blue-600">${r}</p><p class="text-gray-400 text-xs mt-0.5">Role</p></div>
    <div class="card p-3 text-center"><p class="text-2xl font-bold text-red-500">${i}</p><p class="text-gray-400 text-xs mt-0.5">ปิดใช้งาน</p></div>`;
}

function filterUsers() {
  const s = document.getElementById("searchInput").value.toLowerCase();
  const r = document.getElementById("roleFilter").value;
  const v = document.getElementById("statusFilter").value;
  renderTable(allUsers.filter(u =>
    (!s || (u.full_name||"").toLowerCase().includes(s) || (u.username||"").toLowerCase().includes(s)) &&
    (!r || u.role===r) && (!v || u.status===v)
  ));
}

function renderTable(users) {
  const tbody = document.getElementById("userTable");
  if (!users.length) { tbody.innerHTML=`<tr><td colspan="7" class="px-5 py-10 text-center text-gray-400 text-sm">ไม่พบผู้ใช้งาน</td></tr>`; return; }
  tbody.innerHTML = users.map(u => {
    const rc = ROLE_COLORS[u.role]||"bg-gray-100 text-gray-600";
    const rl = ROLE_LABELS[u.role]||u.role;
    const area = [u.tambon, u.moo?`หมู่ ${u.moo}`:""].filter(Boolean).join(" ");
    return `<tr class="border-b border-gray-50 hover:bg-gray-50 cursor-pointer" onclick="editUser('${u.user_id}')">
      <td class="px-5 py-3">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">${(u.full_name||"?")[0]}</div>
          <div><p class="font-medium text-gray-800 text-sm">${u.full_name||"-"}</p><p class="text-gray-400 text-xs">${u.organization||""}</p></div>
        </div>
      </td>
      <td class="px-5 py-3 font-mono text-xs text-gray-600">${u.username||"-"}</td>
      <td class="px-5 py-3"><span class="text-xs px-2 py-0.5 rounded-full font-medium ${rc}">${rl}</span></td>
      <td class="px-5 py-3 text-gray-500 text-xs">${u.position||"-"}</td>
      <td class="px-5 py-3 text-gray-500 text-xs">${area||"-"}</td>
      <td class="px-5 py-3 text-center"><span class="text-xs px-2 py-1 rounded-full ${u.status==="ACTIVE"?"bg-green-100 text-green-700":"bg-gray-100 text-gray-500"}">${u.status==="ACTIVE"?"ใช้งาน":"ปิด"}</span></td>
      <td class="px-5 py-3 text-center" onclick="event.stopPropagation()">
        <button onclick="openResetModal('${u.user_id}','${(u.full_name||u.username).replace(/'/g,"")}')" class="text-xs text-orange-500 hover:underline mr-3">รีเซ็ตรหัส</button>
        <button onclick="toggleStatus('${u.user_id}','${u.status}')" class="text-xs ${u.status==="ACTIVE"?"text-red-500":"text-green-500"} hover:underline">${u.status==="ACTIVE"?"ปิด":"เปิด"}</button>
      </td>
    </tr>`;
  }).join("");
  document.getElementById("tableFooter").textContent = `แสดง ${users.length} จาก ${allUsers.length} รายการ`;
}

function openAddModal() {
  editingId = null;
  document.getElementById("modalTitle").textContent = "เพิ่มผู้ใช้งานใหม่";
  document.getElementById("pwdLabel").innerHTML = 'รหัสผ่าน <span class="text-red-500">*</span>';
  ["f_fullname","f_username","f_password","f_position","f_org","f_tambon","f_moo","f_phone"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f_title").value="นาย"; document.getElementById("f_role").value="";
  document.getElementById("f_status").value="ACTIVE"; document.getElementById("f_province").value="นครราชสีมา"; document.getElementById("f_amphoe").value="พิมาย";
  document.getElementById("f_password").placeholder="อย่างน้อย 8 ตัวอักษร";
  document.getElementById("modalError").classList.add("hidden");
  document.getElementById("userModal").classList.remove("hidden");
}

function editUser(id) {
  const u = allUsers.find(x=>x.user_id===id); if(!u) return;
  editingId = id;
  document.getElementById("modalTitle").textContent = "แก้ไขผู้ใช้งาน";
  document.getElementById("pwdLabel").innerHTML = 'รหัสผ่านใหม่ <span class="text-gray-400 font-normal text-xs">(เว้นว่างถ้าไม่เปลี่ยน)</span>';
  document.getElementById("f_fullname").value=u.full_name||""; document.getElementById("f_title").value=u.title||"นาย";
  document.getElementById("f_username").value=u.username||""; document.getElementById("f_password").value="";
  document.getElementById("f_password").placeholder="เว้นว่างถ้าไม่เปลี่ยนรหัสผ่าน";
  document.getElementById("f_role").value=u.role||""; document.getElementById("f_position").value=u.position||"";
  document.getElementById("f_org").value=u.organization||""; document.getElementById("f_province").value=u.province||"นครราชสีมา";
  document.getElementById("f_amphoe").value=u.amphoe||"พิมาย"; document.getElementById("f_tambon").value=u.tambon||"";
  document.getElementById("f_moo").value=u.moo||""; document.getElementById("f_phone").value=u.phone||"";
  document.getElementById("f_status").value=u.status||"ACTIVE";
  document.getElementById("modalError").classList.add("hidden");
  document.getElementById("userModal").classList.remove("hidden");
}

async function saveUser() {
  const fullname=document.getElementById("f_fullname").value.trim();
  const username=document.getElementById("f_username").value.trim();
  const password=document.getElementById("f_password").value;
  const role=document.getElementById("f_role").value;
  if(!fullname) return showModalError("กรุณากรอกชื่อ-สกุล");
  if(!username) return showModalError("กรุณากรอก Username");
  if(!role)     return showModalError("กรุณาเลือก Role");
  if(!editingId && !password) return showModalError("กรุณากรอกรหัสผ่าน");
  if(password && password.length<8) return showModalError("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร");
  const btn=document.getElementById("saveUserBtn");
  btn.disabled=true; btn.textContent="กำลังบันทึก...";
  const data={user_id:editingId||null,full_name:fullname,title:document.getElementById("f_title").value,
    username,role,organization:document.getElementById("f_org").value,position:document.getElementById("f_position").value,
    province:document.getElementById("f_province").value,amphoe:document.getElementById("f_amphoe").value,
    tambon:document.getElementById("f_tambon").value,moo:document.getElementById("f_moo").value,
    phone:document.getElementById("f_phone").value,status:document.getElementById("f_status").value};
  if(password) data.password=password;
  const res=await API.saveUser(data);
  btn.disabled=false; btn.textContent="บันทึก";
  if(res.success){closeModal("userModal");showToast(editingId?"แก้ไขสำเร็จ ✅":"เพิ่มผู้ใช้สำเร็จ ✅","success");loadUsers();}
  else showModalError(res.message||"บันทึกไม่สำเร็จ");
}

function openResetModal(userId,name){
  resetTargetId=userId;
  document.getElementById("resetUserName").textContent=`ผู้ใช้: ${name}`;
  document.getElementById("r_password").value=""; document.getElementById("r_confirm").value="";
  document.getElementById("resetError").classList.add("hidden");
  document.getElementById("resetModal").classList.remove("hidden");
}

async function doResetPassword(){
  const pwd=document.getElementById("r_password").value;
  const conf=document.getElementById("r_confirm").value;
  if(!pwd) return showResetError("กรุณากรอกรหัสผ่านใหม่");
  if(pwd.length<8) return showResetError("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร");
  if(pwd!==conf) return showResetError("รหัสผ่านไม่ตรงกัน");
  const btn=document.getElementById("resetBtn");
  btn.disabled=true; btn.textContent="กำลังรีเซ็ต...";
  const res=await API.call("auth.resetPassword",{target_user_id:resetTargetId,new_password:pwd});
  btn.disabled=false; btn.textContent="รีเซ็ต";
  if(res.success){closeModal("resetModal");showToast("รีเซ็ตรหัสผ่านสำเร็จ ✅","success");}
  else showResetError(res.message||"รีเซ็ตไม่สำเร็จ");
}

async function toggleStatus(userId,currentStatus){
  const ns=currentStatus==="ACTIVE"?"INACTIVE":"ACTIVE";
  if(!confirm(`ต้องการ${ns==="ACTIVE"?"เปิด":"ปิด"}ใช้งานผู้ใช้นี้ใช่หรือไม่?`)) return;
  const res=await API.saveUser({user_id:userId,status:ns});
  if(res.success){showToast("ดำเนินการสำเร็จ ✅","success");loadUsers();}
  else showToast(res.message||"ไม่สำเร็จ","error");
}

function closeModal(id){document.getElementById(id).classList.add("hidden");}
function showModalError(msg){const el=document.getElementById("modalError");el.textContent=msg;el.classList.remove("hidden");}
function showResetError(msg){const el=document.getElementById("resetError");el.textContent=msg;el.classList.remove("hidden");}
let toastTimer;
function showToast(msg,type="success"){
  const t=document.getElementById("toast"),i=document.getElementById("toastInner"),m=document.getElementById("toastMsg");
  i.className=`flex items-center gap-3 px-5 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${type==="success"?"bg-green-600":"bg-red-500"}`;
  m.textContent=msg; t.classList.remove("hidden"); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add("hidden"),3000);
}
async function doLogout(){await API.logout();Auth.clearSession();window.location.href="../index.html";}
loadUsers();
</script>
</body>
</html>
